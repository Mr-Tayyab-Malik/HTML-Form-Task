<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>HTML-Class-11</title>
</head>
<body>
    <!-- Important Things of forms -->
    <!-- 1)personal information = cradentials -->
    <!-- 2)jo form dikhta ha usko mordal kehte he . -->
    <!-- 3)jo forms me box dikhta ha usko input kehte he -->
    <!-- 4)sur jo form ke input me phele se likha hota ha light color me usko "placeholder" kehte he. -->
    <!-- 5) sahi ko "valid" kehte he aur galat ko "invalid" kehte he. -->
    <!-- 6) default:
                AC cheza jo phele se hi system ki taraf se di hoe hoti ha.  -->
    <!-- 7) bna na ya create karna kehla ta ha "POST" -->

    
    <h1>FORM</h1>
    <form>
        <fieldset>

            <label for="uName">Name</label>
            <input type="text" placeholder="Enter your name" name="uName">
            <br>
            <label for="email">Email</label>
            <input type="email" placeholder="Enter your email" name="email">
            <br>
            <label for="pass">Password</label>
            <input type="password" placeholder="Enter your password" name="pass">
            <br>
            <label for="contact">Contact no</label>
            <input type="number" placeholder="Enter your phone number" name="contact">
            <br>
            <label for="dob">DOB</label>
            <input type="date"  name="dob">
            <br>
            <label for="profile">Profile</label>
            <input type="file"  name="profile">
            <br>
            <label for="gender">Gender</label>
            <br>
            <label for="male">Male</label>
            <input type="radio" name="gender">
            <label for="female">Female</label>
            <input type="radio" name="gender">
            <br>
            <label for="terms">Agree terms and conditions?</label>
            <input type="checkbox" name="terms">
            <br>
            <label for="search">Search</label>
            <input type="search">
            <br>
            <select name="" id="">
                <option value="">Item 1</option>
                <option value="">Item 2</option>
                <option value="">Item 3</option>
                <option value="">Item 4</option>
                <option value="">Item 5</option>
            </select>
            <br>
            <details>
                <summary>open to see</summary>
                <h1>Congratulations! You Got 1000 dollar.</h1>
            </details>
            <br>
            <input type="reset">
            <br>
            <input type="submit">
        </fieldset>
    </form>          
</body>
</html>
